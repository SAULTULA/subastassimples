<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin subasta</title>
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="style.css"></head><body><main>
<h1>⚙️ Panel de subasta</h1>
<div id="login" class="card"><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Contraseña">
<button onclick="login()" style="width:100%">Ingresar</button></div>
<div id="panel" style="display:none">
<div id="last"></div><div id="liveBox"></div>

<!-- ══ TABS ═══════════════════════════════════════════════════════ -->
<div class="adm-tabs">
  <button id="tabLots" class="adm-tab adm-tab--active" onclick="showTab('lots')">📦 Lotes</button>
  <button id="tabAds"  class="adm-tab"                 onclick="showTab('ads')">📢 Publicidades</button>
</div>

<!-- ══ PANEL LOTES ════════════════════════════════════════════════ -->
<div id="panelLots">
<div class="card"><b id="ftitle">Nuevo lote</b>
<input id="t" placeholder="Título"><textarea id="d" rows="2" placeholder="Descripción"></textarea>
<div class="row"><input id="sp" type="number" placeholder="Precio base / referencia"><input id="inc" type="number" placeholder="Incremento mínimo" value="500"></div>
<input id="dur" type="number" inputmode="numeric" placeholder="Duración en minutos (vacío = cierre manual)">

<label style="display:block;margin:8px 0 3px;font-size:.85rem;color:var(--tx-2);font-weight:600">Modalidad de entrega / servicio:</label>
<select id="m" onchange="toggleLocBox()">
  <option value="digital">🌐 Digital / A distancia (Sin límite geográfico)</option>
  <option value="presencial">📍 Presencial / Retiro en mano (Requiere ubicación)</option>
  <option value="envio">📦 Con envío físico (Despacho a todo el país)</option>
</select>

<div id="locBox" class="adm-loc-box" style="display:none">
  <div class="adm-loc-box__title">📍 Ubicación del producto o servicio</div>
  <select id="prov">
    <option value="">Seleccionar provincia *</option>
    <option value="Buenos Aires">Buenos Aires</option>
    <option value="CABA">CABA</option>
    <option value="Catamarca">Catamarca</option>
    <option value="Chaco">Chaco</option>
    <option value="Chubut">Chubut</option>
    <option value="Córdoba">Córdoba</option>
    <option value="Corrientes">Corrientes</option>
    <option value="Entre Ríos">Entre Ríos</option>
    <option value="Formosa">Formosa</option>
    <option value="Jujuy">Jujuy</option>
    <option value="La Pampa">La Pampa</option>
    <option value="La Rioja">La Rioja</option>
    <option value="Mendoza">Mendoza</option>
    <option value="Misiones">Misiones</option>
    <option value="Neuquén">Neuquén</option>
    <option value="Río Negro">Río Negro</option>
    <option value="Salta">Salta</option>
    <option value="San Juan">San Juan</option>
    <option value="San Luis">San Luis</option>
    <option value="Santa Cruz">Santa Cruz</option>
    <option value="Santa Fe">Santa Fe</option>
    <option value="Santiago del Estero">Santiago del Estero</option>
    <option value="Tierra del Fuego">Tierra del Fuego</option>
    <option value="Tucumán">Tucumán</option>
  </select>
  <input id="city" placeholder="Localidad / Barrio / Zona (ej: Quilmes, Palermo, Centro)">
  <input id="ship" placeholder="Aclaración de retiro o envío (ej: Se retira por local comercial)">
</div>

<input id="img" type="file" accept="image/*"><div class="row" style="margin-top:6px"><button onclick="saveLot()" id="addb">Agregar lote</button><button id="cnc" class="s" style="display:none" onclick="resetForm()">Cancelar</button></div></div>
<div id="list"></div>
</div>

<!-- ══ PANEL PUBLICIDADES ═════════════════════════════════════════ -->
<div id="panelAds" style="display:none">
<div class="card">
  <b id="adftitle">Nueva publicidad</b>
  <div class="row">
    <div style="flex:1;min-width:0;display:grid;gap:6px">
      <input id="an"   placeholder="Nombre del negocio *">
      <textarea id="adesc" rows="2" placeholder="Descripción corta"></textarea>
      <input id="aweb"  placeholder="Sitio web (ej: mitienda.com.ar)">
      <input id="aemail" type="email" placeholder="Email de contacto">
      <input id="aphone" placeholder="Teléfono (ej: 1155551234)">
      <input id="aaddr"  placeholder="Dirección">
      <input id="aig"    placeholder="Instagram (solo @usuario)">
      <input id="afb"    placeholder="Facebook (solo @usuario)">
      <input id="awa"    placeholder="WhatsApp (ej: 5491155551234)">
    </div>
    <div style="display:grid;gap:8px;align-content:start">
      <input id="aimg" type="file" accept="image/*">
      <img id="apreview" src="" alt="" style="display:none;width:120px;height:120px;object-fit:contain;border-radius:12px;border:1px solid rgba(255,255,255,.12)">
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;margin-top:6px;cursor:pointer">
    <input id="aactive" type="checkbox" checked> Publicidad activa
  </label>
  <div class="row" style="margin-top:8px">
    <button onclick="saveAd()" id="adsavebtn">Agregar publicidad</button>
    <button id="adcnc" class="s" style="display:none" onclick="resetAdForm()">Cancelar</button>
  </div>
</div>
<div id="adlist"></div>
</div>

<button class="s" style="margin-top:8px" onclick="SB.auth.signOut().then(()=>location.reload())">Salir</button>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// ── helpers ───────────────────────────────────────────────────────────
const MAX_LIVE=10;
let lots=[],bidsBy={},phones={},ads=[];
function showTab(t){
  ['lots','ads'].forEach(x=>{
    $(x==='lots'?'panelLots':'panelAds').style.display=x===t?'block':'none';
    $('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('adm-tab--active',x===t);
  });
}

// ── auth ──────────────────────────────────────────────────────────────
async function login(){
  const {error}=await SB.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  error?alert(error.message):init();
}
async function init(){
  const {data}=await SB.auth.getSession();if(!data.session)return;
  $('login').style.display='none';$('panel').style.display='block';
  SB.channel('adm')
    .on('postgres_changes',{event:'*',schema:'public',table:'lots'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'bids'},load)
    .on('postgres_changes',{event:'*',schema:'public',table:'ads'},loadAds)
    .subscribe();
  load();loadAds();
}

// ── lotes ─────────────────────────────────────────────────────────────
async function load(){
  lots=(await SB.from('lots').select('*').order('position')).data||[];
  const lives=lots.filter(l=>l.status==='live');
  const res=await Promise.all(lives.map(l=>SB.from('bids').select('name,amount').eq('lot_id',l.id).order('amount',{ascending:false}).limit(6)));
  bidsBy={};lives.forEach((l,i)=>bidsBy[l.id]=res[i].data||[]);
  const ids=lots.filter(l=>l.winner_id).map(l=>l.winner_id);
  if(ids.length)(await SB.from('participants').select('id,phone').in('id',ids)).data?.forEach(p=>phones[p.id]=p.phone);
  draw();
}
function wa(l){const p=phones[l.winner_id]||'';return `<a target="_blank" href="https://wa.me/54${p.startsWith('9')?p:'9'+p}">${esc(p)}</a>`}
function modalityTag(l){
  if(l.modality==='presencial') return `<span class="tag tag--presencial">📍 ${esc(l.location_city?l.location_city+', ':'')}${esc(l.location_province||'Presencial')}</span>`;
  if(l.modality==='envio') return `<span class="tag tag--shipping">📦 Envío nacional</span>`;
  return `<span class="tag tag--digital">🌐 Digital</span>`;
}
function draw(){
  const lives=lots.filter(l=>l.status==='live'),full=lives.length>=MAX_LIVE;
  const closed=lots.filter(l=>l.status==='closed').sort((a,b)=>b.closed_at>a.closed_at?1:-1)[0];
  $('last').innerHTML=closed&&closed.winner_name?`<div class="card win"><b>🏆 Último ganador: ${esc(closed.winner_name)}</b><br>${esc(closed.title)} — ${money(closed.current_price)}<br>Celular: ${wa(closed)}<br>${closed.paid_at?'✅ Pagado por Mercado Pago':'⏳ Pendiente de pago'}</div>`:'';
  $('liveBox').innerHTML=(lives.length?`<div class="mut">En vivo: <b>${lives.length}/${MAX_LIVE}</b>${full?' — límite alcanzado':''}</div>`:'')+lives.map(live=>`<div class="card"><span class="tag live">● EN VIVO</span> ${modalityTag(live)} <b>${esc(live.title)}</b>
    <div class="price">${money(live.current_price)}</div>${live.ends_at?`<div class="mut">⏱ Cierra a las ${new Date(live.ends_at).toLocaleTimeString('es-AR')}</div>`:''}<div class="hot">${live.leader_name?'🔥 '+esc(live.leader_name):'Sin ofertas'}</div>
    <div class="bids">${(bidsBy[live.id]||[]).map(x=>`<div><span>${esc(x.name)}</span><b>${money(x.amount)}</b></div>`).join('')}</div>
    <button class="d" style="width:100%;margin-top:10px" onclick="rpc('close_lot','${live.id}')">⏹ Cerrar lote y definir ganador</button></div>`).join('');
  $('list').innerHTML=lots.map(l=>`<div class="card"><div class="row" style="flex-wrap:nowrap">
    ${l.image_url?`<img src="${esc(l.image_url)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;flex:none;margin:0">`:''}
    <div><b>${l.position}. ${esc(l.title)}</b> <span class="tag">${l.status==='pending'?'pendiente':l.status==='live'?'en vivo':'cerrado'}</span> ${modalityTag(l)}
    <div class="mut">Base ${money(l.start_price)} · +${money(l.increment)}${l.status==='closed'?' · Ganó: '+esc(l.winner_name||'nadie')+' '+(l.winner_id?wa(l):'')+(l.winner_id?(l.paid_at?' · ✅ Pagado':' · ⏳ Sin pagar'):''):''}</div>
    ${l.shipping_notes?`<div class="mut" style="font-size:.8rem">ℹ️ ${esc(l.shipping_notes)}</div>`:''}</div></div>
    <div class="row" style="margin-top:8px">${l.status==='pending'?`<button class="g" ${full?'disabled':''} onclick="rpc('launch_lot','${l.id}')">▶ Lanzar</button>`:''}${l.status==='closed'?`<button class="g" ${full?'disabled':''} onclick="rpc('relaunch_lot','${l.id}')">🔁 Relanzar</button>`:''}<button class="s" onclick="editLot('${l.id}')">✏️ Editar</button>${l.status!=='live'?`<button class="s" onclick="del('${l.id}')">Borrar</button>`:''}</div></div>`).join('');
}
async function rpc(fn,id){const {error}=await SB.rpc(fn,{p_lot:id});if(error)alert(error.message);load();}
async function del(id){if(confirm('¿Borrar lote?')){await SB.from('lots').delete().eq('id',id);load();}}
let editId=null;
function toggleLocBox(){
  const m=$('m').value;
  $('locBox').style.display=m==='presencial'||m==='envio'?'grid':'none';
}
function resetForm(){
  editId=null;['t','d','sp','dur','img','city','ship'].forEach(i=>$(i).value='');
  $('prov').value='';$('m').value='digital';$('inc').value=500;toggleLocBox();
  $('ftitle').textContent='Nuevo lote';$('addb').textContent='Agregar lote';$('cnc').style.display='none';
}
function editLot(id){
  const l=lots.find(x=>x.id===id);if(!l)return;editId=id;
  $('t').value=l.title;$('d').value=l.description||'';$('sp').value=l.start_price;$('inc').value=l.increment;$('dur').value=l.duration_minutes||'';$('img').value='';
  $('m').value=l.modality||'digital';$('prov').value=l.location_province||'';$('city').value=l.location_city||'';$('ship').value=l.shipping_notes||'';
  toggleLocBox();
  $('ftitle').textContent='Editando: '+l.title+(l.status==='live'?' (en vivo: el precio base no cambia)':'');
  $('addb').textContent='Guardar cambios';$('cnc').style.display='block';$('t').scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveLot(){
  const t=$('t').value.trim();if(!t)return alert('Falta título');
  const mod=$('m').value;
  const prov=mod!=='digital'?$('prov').value.trim():null;
  const city=mod!=='digital'?$('city').value.trim():null;
  const ship=$('ship').value.trim()||null;
  if(mod==='presencial'&&!prov)return alert('Por favor seleccioná la provincia para el producto o servicio presencial');
  $('addb').disabled=true;let url=null;const f=$('img').files[0];
  if(f){const path=Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');
    const up=await SB.storage.from('lots').upload(path,f);
    if(up.error){$('addb').disabled=false;return alert(up.error.message);}
    url=SB.storage.from('lots').getPublicUrl(path).data.publicUrl;}
  const sp=+$('sp').value||0,inc=+$('inc').value||100,dur=+$('dur').value||null;let error;
  if(editId){
    const l=lots.find(x=>x.id===editId);
    const u={title:t,description:$('d').value,increment:inc,duration_minutes:dur,modality:mod,location_province:prov,location_city:city,shipping_notes:ship};
    if(url)u.image_url=url;
    if(l.status==='pending'){u.start_price=sp;u.current_price=sp;}
    if(l.status==='closed')u.start_price=sp;
    ({error}=await SB.from('lots').update(u).eq('id',editId));
  }else{
    const pos=Math.max(0,...lots.map(l=>l.position))+1;
    ({error}=await SB.from('lots').insert({title:t,description:$('d').value,image_url:url,start_price:sp,current_price:sp,increment:inc,duration_minutes:dur,position:pos,modality:mod,location_province:prov,location_city:city,shipping_notes:ship}));
  }
  $('addb').disabled=false;if(error)return alert(error.message);
  resetForm();load();
}

// ── publicidades ──────────────────────────────────────────────────────
let editAdId=null;
$('aimg').addEventListener('change',()=>{
  const f=$('aimg').files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{$('apreview').src=e.target.result;$('apreview').style.display='block';};
  r.readAsDataURL(f);
});
async function loadAds(){
  ads=(await SB.from('ads').select('*').order('position')).data||[];
  drawAds();
}
function drawAds(){
  $('adlist').innerHTML=ads.map(a=>`<div class="card" style="display:grid;gap:8px">
    <div class="row" style="flex-wrap:nowrap;align-items:center">
      ${a.logo_url?`<img src="${esc(a.logo_url)}" style="width:60px;height:60px;object-fit:contain;border-radius:10px;flex:none;margin:0;border:1px solid rgba(255,255,255,.1)">`:'<span style="font-size:2rem">📢</span>'}
      <div style="flex:1;min-width:0">
        <b>${esc(a.name)}</b>
        <span class="tag" style="margin-left:6px">${a.active?'activa':'inactiva'}</span>
        ${a.web?`<div class="mut">${esc(a.web)}</div>`:''}
        ${a.phone?`<div class="mut">📞 ${esc(a.phone)}</div>`:''}
      </div>
    </div>
    <div class="row">
      <button class="s" onclick="editAd('${a.id}')">✏️ Editar</button>
      <button class="s" onclick="toggleAd('${a.id}',${!a.active})">${a.active?'⏸ Desactivar':'▶ Activar'}</button>
      <button class="s" onclick="delAd('${a.id}')">Borrar</button>
    </div>
  </div>`).join('')||'<div class="card"><span class="mut">No hay publicidades cargadas.</span></div>';
}
function resetAdForm(){
  editAdId=null;
  ['an','adesc','aweb','aemail','aphone','aaddr','aig','afb','awa'].forEach(i=>$(i).value='');
  $('aimg').value='';$('apreview').style.display='none';$('apreview').src='';
  $('aactive').checked=true;
  $('adftitle').textContent='Nueva publicidad';
  $('adsavebtn').textContent='Agregar publicidad';
  $('adcnc').style.display='none';
}
function editAd(id){
  const a=ads.find(x=>x.id===id);if(!a)return;editAdId=id;
  $('an').value=a.name;$('adesc').value=a.description||'';$('aweb').value=a.web||'';
  $('aemail').value=a.email||'';$('aphone').value=a.phone||'';$('aaddr').value=a.address||'';
  $('aig').value=a.instagram||'';$('afb').value=a.facebook||'';$('awa').value=a.whatsapp||'';
  $('aactive').checked=a.active;
  if(a.logo_url){$('apreview').src=a.logo_url;$('apreview').style.display='block';}
  else{$('apreview').style.display='none';$('apreview').src='';}
  $('adftitle').textContent='Editando: '+a.name;
  $('adsavebtn').textContent='Guardar cambios';
  $('adcnc').style.display='block';
  $('an').scrollIntoView({behavior:'smooth',block:'center'});
}
async function saveAd(){
  const name=$('an').value.trim();if(!name)return alert('Falta el nombre del negocio');
  $('adsavebtn').disabled=true;
  let logoUrl=editAdId?ads.find(x=>x.id===editAdId)?.logo_url||null:null;
  const f=$('aimg').files[0];
  if(f){
    const path='ad-'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');
    const up=await SB.storage.from('ads').upload(path,f);
    if(up.error){$('adsavebtn').disabled=false;return alert(up.error.message);}
    logoUrl=SB.storage.from('ads').getPublicUrl(path).data.publicUrl;
  }
  const payload={
    name, description:$('adesc').value||null, logo_url:logoUrl,
    web:$('aweb').value||null, email:$('aemail').value||null,
    phone:$('aphone').value||null, address:$('aaddr').value||null,
    instagram:$('aig').value.replace(/^@/,'')||null,
    facebook:$('afb').value.replace(/^@/,'')||null,
    whatsapp:$('awa').value||null,
    active:$('aactive').checked,
  };
  let error;
  if(editAdId){
    ({error}=await SB.from('ads').update(payload).eq('id',editAdId));
  } else {
    const pos=ads.length?Math.max(...ads.map(a=>a.position))+1:1;
    ({error}=await SB.from('ads').insert({...payload,position:pos}));
  }
  $('adsavebtn').disabled=false;if(error)return alert(error.message);
  resetAdForm();loadAds();
}
async function toggleAd(id,active){
  await SB.from('ads').update({active}).eq('id',id);loadAds();
}
async function delAd(id){
  if(confirm('¿Borrar publicidad?')){await SB.from('ads').delete().eq('id',id);loadAds();}
}

setInterval(()=>{if(lots.some(l=>l.status==='live'&&l.ends_at&&new Date(l.ends_at)<=new Date()))SB.rpc('close_expired').then(load)},5000);
init();
</script></body></html>
