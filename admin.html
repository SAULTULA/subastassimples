<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin subasta</title>
<link rel="stylesheet" href="style.css"></head><body><main>
<h1>⚙️ Panel de subasta</h1>
<div id="login" class="card"><input id="em" type="email" placeholder="Email admin"><input id="pw" type="password" placeholder="Contraseña">
<button onclick="login()" style="width:100%">Ingresar</button></div>
<div id="panel" style="display:none">
<div id="last"></div><div id="liveBox"></div>
<div class="card"><b>Nuevo lote</b>
<input id="t" placeholder="Título"><textarea id="d" rows="2" placeholder="Descripción"></textarea>
<div class="row"><input id="sp" type="number" placeholder="Precio base / referencia"><input id="inc" type="number" placeholder="Incremento mínimo" value="500"></div>
<input id="img" type="file" accept="image/*"><button onclick="addLot()" id="addb" style="width:100%">Agregar lote</button></div>
<div id="list"></div>
<button class="s" onclick="SB.auth.signOut().then(()=>location.reload())">Salir</button>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
let lots=[],bids=[],phones={};
async function login(){
  const {error}=await SB.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  error?alert(error.message):init();
}
async function init(){
  const {data}=await SB.auth.getSession();if(!data.session)return;
  $('login').style.display='none';$('panel').style.display='block';
  SB.channel('adm').on('postgres_changes',{event:'*',schema:'public',table:'lots'},load)
   .on('postgres_changes',{event:'*',schema:'public',table:'bids'},load).subscribe();
  load();
}
async function load(){
  lots=(await SB.from('lots').select('*').order('position')).data||[];
  const live=lots.find(l=>l.status==='live');
  bids=live?(await SB.from('bids').select('name,amount').eq('lot_id',live.id).order('amount',{ascending:false}).limit(6)).data||[]:[];
  const ids=lots.filter(l=>l.winner_id).map(l=>l.winner_id);
  if(ids.length)(await SB.from('participants').select('id,phone').in('id',ids)).data?.forEach(p=>phones[p.id]=p.phone);
  draw();
}
function wa(l){const p=phones[l.winner_id]||'';return `<a target="_blank" href="https://wa.me/54${p.startsWith('9')?p:'9'+p}">${esc(p)}</a>`}
function draw(){
  const live=lots.find(l=>l.status==='live');
  const closed=lots.filter(l=>l.status==='closed').sort((a,b)=>b.closed_at>a.closed_at?1:-1)[0];
  $('last').innerHTML=closed&&closed.winner_name?`<div class="card win"><b>🏆 Último ganador: ${esc(closed.winner_name)}</b><br>${esc(closed.title)} — ${money(closed.current_price)}<br>Celular: ${wa(closed)}</div>`:'';
  $('liveBox').innerHTML=live?`<div class="card"><span class="tag live">● EN VIVO</span> <b>${esc(live.title)}</b>
    <div class="price">${money(live.current_price)}</div><div class="hot">${live.leader_name?'🔥 '+esc(live.leader_name):'Sin ofertas'}</div>
    <div class="bids">${bids.map(x=>`<div><span>${esc(x.name)}</span><b>${money(x.amount)}</b></div>`).join('')}</div>
    <button class="d" style="width:100%;margin-top:10px" onclick="rpc('close_lot','${live.id}')">⏹ Cerrar lote y definir ganador</button></div>`:'';
  $('list').innerHTML=lots.map(l=>`<div class="card"><div class="row" style="flex-wrap:nowrap">
    ${l.image_url?`<img src="${esc(l.image_url)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;flex:none;margin:0">`:''}
    <div><b>${l.position}. ${esc(l.title)}</b> <span class="tag">${l.status==='pending'?'pendiente':l.status==='live'?'en vivo':'cerrado'}</span>
    <div class="mut">Base ${money(l.start_price)} · +${money(l.increment)}${l.status==='closed'?' · Ganó: '+esc(l.winner_name||'nadie')+' '+(l.winner_id?wa(l):''):''}</div></div></div>
    ${l.status==='pending'?`<div class="row" style="margin-top:8px"><button class="g" ${live?'disabled':''} onclick="rpc('launch_lot','${l.id}')">▶ Lanzar</button><button class="s" onclick="del('${l.id}')">Borrar</button></div>`:''}</div>`).join('');
}
async function rpc(fn,id){const {error}=await SB.rpc(fn,{p_lot:id});if(error)alert(error.message);load();}
async function del(id){if(confirm('¿Borrar lote?')){await SB.from('lots').delete().eq('id',id);load();}}
async function addLot(){
  const t=$('t').value.trim();if(!t)return alert('Falta título');
  $('addb').disabled=true;let url=null;const f=$('img').files[0];
  if(f){const path=Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');
    const up=await SB.storage.from('lots').upload(path,f);
    if(up.error){$('addb').disabled=false;return alert(up.error.message);}
    url=SB.storage.from('lots').getPublicUrl(path).data.publicUrl;}
  const pos=Math.max(0,...lots.map(l=>l.position))+1,sp=+$('sp').value||0;
  const {error}=await SB.from('lots').insert({title:t,description:$('d').value,image_url:url,start_price:sp,current_price:sp,increment:+$('inc').value||100,position:pos});
  $('addb').disabled=false;if(error)return alert(error.message);
  ['t','d','sp','img'].forEach(i=>$(i).value='');load();
}
init();
</script></body></html>
