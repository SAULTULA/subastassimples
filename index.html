<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subastas en vivo</title>
  <meta name="description" content="Subasta Todo: pujá en hasta 10 lotes al mismo tiempo.">
  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page page--wide">
    <!-- Carrusel de publicidades: se llena desde Supabase -->
    <section id="adCarousel" class="adcar" aria-label="Publicidades" style="display:none">
      <div id="adTrack" class="adcar__track"></div>
      <div class="adcar__nav" id="adNav" aria-hidden="true"></div>
    </section>

    <header class="brand">
      <img class="brand__logo" src="logo.png" alt="Logo Subasta" width="1254" height="1254" fetchpriority="high">
      <div class="brand__text">
        <h1 class="brand__title">Subasta <span class="brand__accent">Todo</span></h1>
        <p class="brand__tagline">Pujá en tiempo real · Ganá al mejor precio</p>
      </div>
    </header>

    <div id="reg" class="card reg reg--hidden"><b>Anotate para pujar</b>
      <input id="nm" placeholder="Nombre"><input id="ph" placeholder="Celular (ej: 1155551234)" inputmode="tel">
      <button id="regBtn" class="reg__btn">Entrar a la subasta</button>
    </div>
    <aside class="sell" aria-labelledby="sellTitle">
      <img class="sell__icon" src="mazo.png" alt="" aria-hidden="true" width="96" height="96" loading="lazy">
      <div class="sell__body">
        <span class="sell__badge">📢 Publicidad</span>
        <h2 id="sellTitle" class="sell__title">¿Tenés algo para vender? Subastalo acá</h2>
        <p class="sell__note">Escribinos por WhatsApp. La comisión se acuerda antes de subir el producto.</p>
      </div>
      <a id="sellBtn" class="sell__btn"
        href="https://wa.me/5491166508379?text=Hola%2C%20quiero%20subastar%20un%20producto%20en%20la%20p%C3%A1gina."
        target="_blank" rel="noopener">Quiero subastar 📲</a>
    </aside>
    <footer class="ksm">
      <a class="ksm__brand" href="https://ksmservicios.com.ar" target="_blank" rel="noopener">
        <img class="ksm__logo" src="ksm.png" alt="KSM Servicios" width="120" height="120" loading="lazy">
      </a>
      <p class="ksm__info">
        <a class="ksm__link" href="https://ksmservicios.com.ar" target="_blank" rel="noopener">ksmservicios.com.ar</a>
        <span class="ksm__copy">© <span id="year">2026</span> KSM Servicios · Todos los derechos reservados</span>
      </p>
    </footer>
    <section id="wins" class="wins"></section>
    <div id="banner"></div>

    <!-- ══ FILTRO DE UBICACIÓN Y MODALIDAD ══════════════════════════ -->
    <nav class="filter" aria-label="Filtro de productos y servicios">
      <div class="filter__group">
        <label for="filterProv" class="filter__label">📍 Tu provincia:</label>
        <select id="filterProv" class="filter__select">
          <option value="all">📍 Todas las provincias</option>
          <option value="Buenos Aires">Buenos Aires</option>
          <option value="CABA">CABA</option>
          <option value="Catamarca">Catamarca</option>
          <option value="Chaco">Chaco</option>
          <option value="Chubut">Chubut</option>
          <option value="Córdoba">Córdoba</option>
          <option value="Corrientes">Corrientes</option>
          <option value="Entre Ríos">Entre Ríos</option>
          <option value="Formosa">Formosa</option>
          <option value="Jujuy">Jujuy</option>
          <option value="La Pampa">La Pampa</option>
          <option value="La Rioja">La Rioja</option>
          <option value="Mendoza">Mendoza</option>
          <option value="Misiones">Misiones</option>
          <option value="Neuquén">Neuquén</option>
          <option value="Río Negro">Río Negro</option>
          <option value="Salta">Salta</option>
          <option value="San Juan">San Juan</option>
          <option value="San Luis">San Luis</option>
          <option value="Santa Cruz">Santa Cruz</option>
          <option value="Santa Fe">Santa Fe</option>
          <option value="Santiago del Estero">Santiago del Estero</option>
          <option value="Tierra del Fuego">Tierra del Fuego</option>
          <option value="Tucumán">Tucumán</option>
        </select>
      </div>
      <div class="filter__pills">
        <button class="filter__pill filter__pill--active" data-mod="all">Todos</button>
        <button class="filter__pill" data-mod="digital">🌐 Solo Digitales</button>
        <button class="filter__pill" data-mod="presencial">📍 Solo Presenciales</button>
      </div>
    </nav>

    <section id="live" class="auctions"></section>
    <div id="next"></div>

    <!-- ══ CONTADOR DE VISITAS ═════════════════════════════════════ -->
    <section class="counter" aria-label="Contador de visitas">
      <iframe class="counter__widget" src="https://gente-de-medios.vercel.app/widget?id=subastas" width="280" height="350" frameborder="0" scrolling="no" style="border:none; overflow:hidden; border-radius:8px;" title="Contador de visitas"></iframe>
    </section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const MAX_LIVE = 10;
    let me = JSON.parse(localStorage.getItem('me') || 'null'), lives = [], bidsBy = {}, next = null, last = null, wins = [];
    let offset = 0, lastClose = 0, payMsg = {}, contacts = {}, msgs = {};
    let filterProv = localStorage.getItem('subasta_filter_prov') || 'all';
    let filterMod = localStorage.getItem('subasta_filter_mod') || 'all';
    if (me && !me.secret) { localStorage.removeItem('me'); me = null; }
    const pagoParam = new URLSearchParams(location.search).get('pago');
    const payNotice = pagoParam === 'ok' || pagoParam === 'pendiente' ? 'Estamos confirmando tu pago… en unos segundos aparece el botón de WhatsApp.' : pagoParam === 'error' ? 'El pago no se completó. Podés intentar de nuevo.' : '';
    const newSecret = () => Array.from(crypto.getRandomValues(new Uint8Array(24)), b => b.toString(16).padStart(2, '0')).join('');
    async function syncClock() { // reloj del servidor para que la cuenta regresiva sea igual en todos los celulares
      const t0 = Date.now(), { data } = await SB.rpc('server_now');
      if (data) offset = new Date(data).getTime() - (t0 + Date.now()) / 2;
    }
    const msLeft = l => l.ends_at ? new Date(l.ends_at).getTime() - (Date.now() + offset) : Infinity;
    const fmt = ms => { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0'); return (h ? h + ':' : '') + p(m) + ':' + p(x) };
    const minBid = l => l.leader_id ? Number(l.current_price) + Number(l.increment) : Number(l.start_price);

    function tick() {
      let expired = false;
      for (const l of lives) {
        if (!l.ends_at) continue;
        const ms = msLeft(l), el = $('cd-' + l.id);
        if (el) el.textContent = ms > 0 ? fmt(ms) : 'Finalizado';
        if (ms <= 0) { expired = true; $('card-' + l.id)?.classList.add('auction--ended'); }
      }
      if (expired && Date.now() - lastClose > 3000) { lastClose = Date.now(); SB.rpc('close_expired').then(load); }
    }

    async function pay(lotId) {
      payMsg[lotId] = 'Abriendo Mercado Pago…'; drawWins();
      try {
        const r = await fetch('/api/create-payment', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lot_id: String(lotId), participant_id: String(me.id), secret: me.secret })
        });
        const d = await r.json();
        if (!r.ok || !d.url) throw new Error(d.error || 'No se pudo iniciar el pago');
        location.href = d.url;
      } catch (e) { payMsg[lotId] = e.message; drawWins(); }
    }
    async function loadContacts() { // el servidor entrega el WhatsApp solo si ya pagaste
      for (const l of wins) {
        if (!l.paid_at || contacts[l.id]) continue;
        const { data } = await SB.rpc('get_contact', { p_lot: String(l.id), p_participant: String(me.id), p_secret: me.secret });
        if (data) { contacts[l.id] = data; drawWins(); }
      }
    }
    function wonCard(l) {
      const head = `<b>🏆 ¡Ganaste "${esc(l.title)}" por ${money(l.current_price)}!</b>`;
      if (l.paid_at) {
        const wa = contacts[l.id];
        if (!wa) return `<div class="card win">${head}<p>✅ Pago recibido. Cargando el contacto…</p></div>`;
        const txt = encodeURIComponent('Hola, gané "' + l.title + '" en la subasta y ya pagué.');
        return `<div class="card win">${head}<p>✅ Pago recibido. Coordiná la entrega con la organizadora:</p>
      <a class="btn-wa" href="https://wa.me/${esc(wa)}?text=${txt}" target="_blank" rel="noopener">Contactar por WhatsApp</a></div>`;
      }
      return `<div class="card win">${head}<p>Pagá con Mercado Pago para recibir el contacto de la organizadora.</p>
    <button class="win__pay" data-action="pay" data-lot="${esc(l.id)}">Pagar ${money(l.current_price)} con Mercado Pago</button>
    <div class="mut win__msg">${esc(payMsg[l.id] || payNotice)}</div></div>`;
    }
    function drawWins() { $('wins').innerHTML = me ? wins.map(wonCard).join('') : ''; }

    async function register() {
      const n = $('nm').value.trim(), p = $('ph').value.replace(/\D/g, '');
      if (!n || p.length < 8) return alert('Poné nombre y celular válido');
      const s = newSecret();
      const { data, error } = await SB.rpc('register', { p_name: n, p_phone: p, p_secret: s });
      if (error) return alert(error.message);
      me = { id: data, name: n, secret: s }; localStorage.setItem('me', JSON.stringify(me)); load();
    }
    async function bid(lotId, v) {
      const l = lives.find(x => x.id === lotId); if (!l || !me) return;
      if (l.modality === 'presencial') {
        const loc = (l.location_city ? l.location_city + ', ' : '') + (l.location_province || 'esta zona');
        const ok = confirm(`⚠️ Atención: este producto/servicio es PRESENCIAL y se retira o realiza en: ${loc}.\n\n¿Confirmás que podés asistir o retirarlo en persona?`);
        if (!ok) return;
      }
      v = v || minBid(l);
      const { data, error } = await SB.rpc('place_bid', { p_lot: lotId, p_participant: me.id, p_secret: me.secret, p_amount: v });
      msgs[lotId] = error ? error.message : data === 'ok' ? '✅ Ofertaste ' + money(v) : data.startsWith('low') ? 'Tu oferta es baja, mínimo ' + money(data.split(':')[1]) : data === 'closed' ? 'El lote ya cerró' : 'Registrate de nuevo';
      const inp = $('amt-' + lotId); if (inp) inp.value = '';
      load();
    }

    let loading = false, again = false;
    async function load() {
      if (loading) { again = true; return; } loading = true;
      try {
        const [a, b, c, w] = await Promise.all([
          SB.from('lots').select('*').eq('status', 'live').order('position').limit(MAX_LIVE),
          SB.from('lots').select('*').eq('status', 'pending').order('position').limit(1),
          SB.from('lots').select('*').eq('status', 'closed').order('closed_at', { ascending: false }).limit(1),
          me ? SB.from('lots').select('*').eq('status', 'closed').eq('winner_id', me.id).order('closed_at', { ascending: false }).limit(20) : Promise.resolve({ data: [] })]);
        lives = a.data || []; next = b.data?.[0] || null; last = c.data?.[0] || null; wins = w.data || [];
        const res = await Promise.all(lives.map(l => SB.from('bids').select('name,amount').eq('lot_id', l.id).order('amount', { ascending: false }).limit(4)));
        bidsBy = {}; lives.forEach((l, i) => bidsBy[l.id] = res[i].data || []);
        draw(); loadContacts();
      } finally { loading = false; if (again) { again = false; load(); } }
    }

    function modalityBadge(l) {
      const mod = l.modality || 'digital';
      if (mod === 'presencial') {
        const loc = (l.location_city ? l.location_city + ', ' : '') + (l.location_province || 'Presencial');
        return `<span class="tag tag--presencial">📍 ${esc(loc)}</span>`;
      }
      if (mod === 'envio') {
        return `<span class="tag tag--shipping">📦 Con Envío</span>`;
      }
      return `<span class="tag tag--digital">🌐 Digital / A distancia</span>`;
    }

    function auctionCard(l) {
      const bids = bidsBy[l.id] || [], ended = msLeft(l) <= 0, mine = me && l.leader_id === me.id;
      return `<article id="card-${esc(l.id)}" class="card auction${ended ? ' auction--ended' : ''}${mine ? ' auction--leading' : ''}">
    <span class="tag live">● EN VIVO</span> ${modalityBadge(l)}
    ${l.image_url ? `<img class="auction__img" src="${esc(l.image_url)}" alt="${esc(l.title)}" loading="lazy">` : ''}
    <h2 class="auction__title">${esc(l.title)}</h2>
    ${l.modality === 'presencial' ? `
      <div class="auction__location-note">
        📍 <b>Retiro / Servicio presencial:</b> ${esc((l.location_city ? l.location_city + ', ' : '') + (l.location_province || 'Zona a coordinar'))}
        ${l.shipping_notes ? `<br><small class="mut">${esc(l.shipping_notes)}</small>` : ''}
      </div>` : ''}
    ${l.modality === 'envio' && l.shipping_notes ? `
      <div class="auction__location-note" style="color:var(--sys-teal);background:rgba(90,200,250,.08);border-color:rgba(90,200,250,.25)">
        📦 <b>Envío:</b> ${esc(l.shipping_notes)}
      </div>` : ''}
    ${l.description ? `<div class="mut auction__desc auction__desc--collapsed" id="desc-${esc(l.id)}">${esc(l.description)}</div><button class="auction__more" data-action="toggle-desc" data-lot="${esc(l.id)}" aria-expanded="false" aria-controls="desc-${esc(l.id)}">Ver más ▾</button>` : ''}
    ${l.ends_at ? `<div class="mut auction__timer">⏱ Cierra en <b id="cd-${esc(l.id)}" class="auction__cd">--:--</b></div>` : ''}
    <div class="mut auction__label">${l.leader_id ? 'Oferta actual' : 'Precio base'}</div>
    <div class="price auction__price">${money(l.current_price)}</div>
    ${l.leader_name ? `<div class="hot">🔥 ${esc(l.leader_name)}${mine ? ' (¡vos!)' : ''}</div>` : '<div class="mut">Todavía sin ofertas</div>'}
    <div class="bids">${bids.map(x => `<div><span>${esc(x.name)}</span><b>${money(x.amount)}</b></div>`).join('')}</div>
    ${me ? `<div class="auction__bid">
      <button class="auction__quick" data-action="bid" data-lot="${esc(l.id)}">Pujar ${money(minBid(l))}</button>
      <div class="row"><input id="amt-${esc(l.id)}" type="number" inputmode="numeric" placeholder="Otro monto">
      <button class="s" data-action="bid-custom" data-lot="${esc(l.id)}">Pujar</button></div>
      <div class="mut auction__msg">${esc(msgs[l.id] || '')}</div></div>` : ''}
  </article>`;
    }

    function draw() {
      $('reg').classList.toggle('reg--hidden', !!me);
      drawWins();
      $('banner').innerHTML = !lives.length && last && !(me && last.winner_id === me.id)
        ? `<div class="card"><span class="mut">Último lote cerrado</span><br><b>${esc(last.title)}</b> — ganó <b>${esc(last.winner_name || 'sin ofertas')}</b> ${last.winner_name ? 'por ' + money(last.current_price) : ''}</div>` : '';
      
      const filteredLives = lives.filter(l => {
        const mod = l.modality || 'digital';
        if (filterMod === 'digital' && mod !== 'digital') return false;
        if (filterMod === 'presencial' && mod !== 'presencial') return false;
        // Si es presencial y el usuario eligió una provincia específica, solo mostrar si coincide
        if (mod === 'presencial' && filterProv !== 'all') {
          if (l.location_province && l.location_province !== filterProv) return false;
        }
        return true;
      });

      // conservar lo que el usuario está escribiendo mientras llega el tiempo real
      const typed = {}; lives.forEach(l => { const i = $('amt-' + l.id); if (i && i.value) typed[l.id] = i.value; });
      const focusId = document.activeElement?.id;
      
      if (!lives.length) {
        $('live').innerHTML = `<div class="card auctions__empty"><b>Esperando que se lance el próximo lote…</b></div>`;
      } else if (!filteredLives.length) {
        $('live').innerHTML = `<div class="card auctions__empty">
          <b>No hay subastas para los filtros seleccionados.</b><br>
          <span class="mut">Probá seleccionando "Todas las provincias" o la pestaña "Todos". Los productos digitales siempre están disponibles.</span>
        </div>`;
      } else {
        $('live').innerHTML = filteredLives.map(auctionCard).join('');
      }

      for (const id in typed) { const i = $('amt-' + id); if (i) i.value = typed[id]; }
      if (focusId && $(focusId)) $(focusId).focus();
      $('next').innerHTML = next ? `<div class="card next"><span class="mut">Próximo lote</span> ${modalityBadge(next)}<div class="next__body">
    ${next.image_url ? `<img class="next__img" src="${esc(next.image_url)}" alt="${esc(next.title)}">` : ''}
    <div><b>${esc(next.title)}</b><div class="mut">Base ${money(next.start_price)}</div></div></div></div>` : '';
      tick();
    }

    document.addEventListener('click', e => {
      const b = e.target.closest('[data-action]'); if (!b) return;
      const id = b.dataset.lot;
      if (b.dataset.action === 'bid') bid(id);
      if (b.dataset.action === 'bid-custom') bid(id, +($('amt-' + id)?.value || 0));
      if (b.dataset.action === 'pay') pay(id);
      if (b.dataset.action === 'toggle-desc') {
        const desc = $('desc-' + id);
        const expanded = b.getAttribute('aria-expanded') === 'true';
        desc.classList.toggle('auction__desc--collapsed', expanded);
        b.setAttribute('aria-expanded', String(!expanded));
        b.textContent = expanded ? 'Ver más ▾' : 'Ver menos ▴';
      }
    });
    // Control del filtro de provincia y modalidad
    if ($('filterProv')) {
      $('filterProv').value = filterProv;
      $('filterProv').addEventListener('change', e => {
        filterProv = e.target.value;
        localStorage.setItem('subasta_filter_prov', filterProv);
        draw();
      });
    }
    document.querySelectorAll('.filter__pill').forEach(btn => {
      btn.classList.toggle('filter__pill--active', btn.dataset.mod === filterMod);
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter__pill').forEach(b => b.classList.remove('filter__pill--active'));
        btn.classList.add('filter__pill--active');
        filterMod = btn.dataset.mod;
        localStorage.setItem('subasta_filter_mod', filterMod);
        draw();
      });
    });

    $('regBtn').addEventListener('click', register);
    SB.channel('pub').on('postgres_changes', { event: '*', schema: 'public', table: 'lots' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bids' }, load).subscribe();
    syncClock().then(load); setInterval(load, 8000); setInterval(tick, 1000);

    // ── carrusel de publicidades ──────────────────────────────────────
    let _adsList = [], _adIdx = 0, _adTimer = null;

    function adLink(href, label, icon) {
      return `<a class="adcard__link" href="${esc(href)}" target="_blank" rel="noopener">${icon} ${esc(label)}</a>`;
    }
    function buildAdCard(a) {
      const links = [];
      if (a.web)       links.push(adLink('https://'+a.web.replace(/^https?:\/\//,''), a.web, '🌐'));
      if (a.whatsapp)  links.push(adLink('https://wa.me/'+a.whatsapp, 'WhatsApp', '💬'));
      if (a.instagram) links.push(adLink('https://instagram.com/'+a.instagram, '@'+a.instagram, '📸'));
      if (a.facebook)  links.push(adLink('https://facebook.com/'+a.facebook, '@'+a.facebook, '👍'));
      if (a.email)     links.push(adLink('mailto:'+a.email, a.email, '✉️'));
      if (a.phone)     links.push(adLink('tel:'+a.phone, a.phone, '📞'));
      if (a.address)   links.push(`<span class="adcard__link">📍 ${esc(a.address)}</span>`);
      return `<article class="adcard">
        ${a.logo_url ? `<img class="adcard__logo" src="${esc(a.logo_url)}" alt="${esc(a.name)}" loading="lazy">` : ''}
        <div class="adcard__body">
          <span class="adcard__badge">Publicidad</span>
          <strong class="adcard__name">${esc(a.name)}</strong>
          ${a.description ? `<p class="adcard__desc">${esc(a.description)}</p>` : ''}
          ${links.length ? `<div class="adcard__links">${links.join('')}</div>` : ''}
        </div>
      </article>`;
    }
    function renderAds() {
      const sec = $('adCarousel');
      if (!_adsList.length) { sec.style.display = 'none'; return; }
      sec.style.display = '';
      $('adTrack').innerHTML = _adsList.map(buildAdCard).join('');
      // puntos
      $('adNav').innerHTML = _adsList.map((_, i) =>
        `<button class="adcar__dot${i === 0 ? ' adcar__dot--active' : ''}" data-adidx="${i}" aria-label="Anuncio ${i+1}"></button>`
      ).join('');
      goAd(0);
    }
    function goAd(idx) {
      _adIdx = (idx + _adsList.length) % _adsList.length;
      $('adTrack').style.transform = `translateX(-${_adIdx * 100}%)`;
      document.querySelectorAll('.adcar__dot').forEach((d, i) =>
        d.classList.toggle('adcar__dot--active', i === _adIdx));
    }
    function startAdTimer() {
      clearInterval(_adTimer);
      if (_adsList.length > 1) _adTimer = setInterval(() => goAd(_adIdx + 1), 5000);
    }
    async function loadAds() {
      const { data } = await SB.from('ads').select('*').eq('active', true).order('position').limit(5);
      _adsList = data || [];
      renderAds();
      startAdTimer();
    }
    $('adNav').addEventListener('click', e => {
      const b = e.target.closest('[data-adidx]');
      if (b) { goAd(+b.dataset.adidx); startAdTimer(); }
    });
    SB.channel('pub')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'lots' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bids' }, load)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'ads'  }, loadAds)
      .subscribe();
    loadAds();

  </script>
</body>

</html>
